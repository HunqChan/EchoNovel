version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: echonovel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-echonovel_db}
      MYSQL_USER: ${MYSQL_USER:-echonovel}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-echonovel123}
    ports:
      - "3307:3306"
    volumes:
      - echonovel_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  echonovel_mysql_data:
    driver: local
