# ========================
# Server
# ========================
server.port=8080

# ========================
# MySQL Database
# ========================
spring.datasource.url=jdbc:mysql://localhost:3307/echonovel_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# JPA / Hibernate
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================
# JWT
# ========================
app.jwt.secret=
app.jwt.expiration=900000
app.jwt.refresh-expiration=604800000

# ========================
# File Upload
# ========================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=./uploads
app.upload.audio-dir=uploads/audio

# ========================
# App Base URL (for audio URL construction)
# ========================
app.base-url=http://localhost:8080
